<!doctype html><html><head><meta charset="utf-8"><title>Systemata video player</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:1920px;height:1080px}</style></head>
<body><canvas id="cv" width="1920" height="1080"></canvas>
<script src="lib.js"></script>
<script>
const slug = new URLSearchParams(location.search).get('v') || 'pipeline';
window.module = { exports: {} };
const s = document.createElement('script'); s.src = 'videos/' + slug + '.js';
s.onload = () => {
  const V = window.module.exports, c = document.getElementById('cv').getContext('2d');
  window.V = V;
  window.render = t => { c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; L.bg(c, t); V.draw(c, t, L); c.globalAlpha = 1; L.chrome(c, t, V.duration); };
  window.frame = t => { window.render(t); return document.getElementById('cv').toDataURL('image/jpeg', .93); };
  window.__ready = true;
  if (location.hash !== '#render') { const t0 = performance.now(); (function f(n) { window.render(((n - t0) / 1000) % V.duration); requestAnimationFrame(f); })(t0); }
};
document.head.appendChild(s);
</script></body></html>
